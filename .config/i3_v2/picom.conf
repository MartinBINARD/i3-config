# Backend GLX — optimal with proprietary NVIDIA drivers
backend     = "glx";
glx-no-stencil = true;

vsync = true;

# ──────────────────────────────────────────────────────────────
# OPACITY
# ──────────────────────────────────────────────────────────────
inactive-opacity   = 0.93;
active-opacity     = 1.0;
frame-opacity      = 1.0;
popup-menu-opacity = 1.0;

# Always opaque
opacity-rule = [
    "100:class_g = 'i3bar'",
    "100:class_g = 'i3lock'",
    "100:class_g = 'vlc'",
    "100:class_g = 'firefox'",
    "100:class_g = 'Firefox'"
];

# ──────────────────────────────────────────────────────────────
# FADE
# ──────────────────────────────────────────────────────────────
fading         = true;
fade-in-step   = 0.06;
fade-out-step  = 0.06;
fade-delta     = 5;

# ──────────────────────────────────────────────────────────────
# SHADOWS — disabled (clean with i3 tiling)
# ──────────────────────────────────────────────────────────────
shadow = false;

# ──────────────────────────────────────────────────────────────
# ROUNDING (optional — remove if artifacts appear)
# ──────────────────────────────────────────────────────────────
# corner-radius = 6;

# ──────────────────────────────────────────────────────────────
# NVIDIA PERFORMANCE
# ──────────────────────────────────────────────────────────────
glx-copy-from-front = false;
use-damage          = true;
