general {
        colors = true
        interval = 3
        color_good = "#11aaaa"
        color_degraded = "#5F676A"
        color_bad = "#900000"
}

order += "wireless _first_"
order += "ethernet _first_"
order += "disk /"
order += "memory"
order += "cpu_usage"
order += "read_file keyboard"
order += "volume master"
order += "tztime local"

wireless _first_ {
        format_up = "WiFi: %essid (%quality)"
        format_down = "WiFi: off"
}

ethernet _first_ {
        format_up = "ETH: %ip"
        format_down = "ETH: off"
}

disk "/" {
        format = "/ %avail"
}

memory {
        format = "RAM: %used/%total"
        threshold_degraded = "2G"
}

cpu_usage {
        format = "CPU: %usage"
}

read_file keyboard {
        format = "KBD: %content"
        path = "/tmp/i3-keyboard-layout"
}

volume master {
        format = "♪: %volume"
        format_muted = "♪: muted (%volume)"
        device = "pulse:alsa_output.pci-0000_00_1f.3.analog-stereo"
}

tztime local {
        format = "%d/%m %H:%M"
}
