general {
        colors = true
        interval = 3
        color_good = "#11aaaa"
        color_degraded = "#5F676A"
        color_bad = "#900000"
        output_format = "i3bar"
}

order += "read_file keyboard"
order += "wireless _first_"
order += "ethernet _first_"
order += "disk /"
order += "memory"
order += "cpu_usage"
order += "volume master"
order += "tztime local"

read_file keyboard {
    # IMPORTANT : replace 'john' with your own user
    path    = "/home/john/.config/i3/keyboard_layout"
    format  = "⌨ %content"
    color   = "#FBB829"
}

wireless _first_ {
        format_up = "WiFi: %essid (%quality)"
        format_down = "WiFi: off"
}

ethernet _first_ {
        format_up = "ETH: %ip"
        format_down = "ETH: off"
}

disk "/" {
    format          = "  %avail"
    prefix_type     = "custom"
    low_threshold   = 15
    threshold_type  = "percentage_avail"
}

memory {
        format = "RAM: %used/%total"
        threshold_degraded  = "4G"
        format_degraded     = " LOW: %available"
}

cpu_usage {
    format      = "  %usage"
    max_threshold = 90
    degraded_threshold = 70
}

volume master {
        format = "♪: %volume"
        format_muted = "♪: muted (%volume)"
        device = "pulse:alsa_output.pci-0000_00_1f.3.analog-stereo"
}

tztime local {
        format = "%d/%m %H:%M"
}
